# Root-level mypy config so `mypy backend/` (run from the repo root in CI)
# discovers the project's type-checking policy. Mirrors backend/pyproject.toml
# [tool.mypy]. Without this, CI ran mypy with defaults (ignore_missing_imports
# off), failing on untyped third-party libs (fpdf2, passlib).
[mypy]
python_version = 3.13
strict = False
ignore_missing_imports = True
disallow_untyped_defs = False
exclude = alembic/versions/
