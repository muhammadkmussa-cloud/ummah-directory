[project]
name = "ummah-directory-backend"
version = "1.0.0"
description = "ummah Directory Platform - Backend API"
requires-python = ">=3.13"
dependencies = [
    "fastapi[standard]>=0.115",
    "uvicorn[standard]>=0.32",
    "sqlalchemy[asyncio]>=2.0",
    "asyncpg>=0.30",
    "alembic>=1.14",
    "pydantic>=2.10",
    "pydantic-settings>=2.7",
    "python-jose[cryptography]>=3.3",
    "passlib[bcrypt]>=1.7",
    "python-multipart>=0.0.18",
    "httpx>=0.28",
    "redis>=5.2",
    "celery>=5.4",
    "boto3>=1.35",
    "stripe>=11.4",
    "sentry-sdk>=2.19",
    "python-dotenv>=1.0",
    "email-validator>=2.2",
    "Pillow>=11.1",
    "structlog>=24.4",
    "itsdangerous>=2.2",
    "slowapi>=0.1.9",
    "pyotp>=2.9",
    "fpdf2>=2.8",
    "argon2-cffi>=23.1",
    "pywebpush>=2.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.3",
    "pytest-asyncio>=0.24",
    "pytest-cov>=6.0",
    "aiosqlite>=0.20.0",
    "ruff>=0.8",
    "mypy>=1.13",
    "factory-boy>=3.3",
    "httpx>=0.28",
]

[tool.setuptools.packages.find]
where = ["."]
include = ["app*"]

[tool.ruff]
target-version = "py313"
line-length = 100
extend-exclude = [
  "alembic/versions",  # historical migrations are immutable records — do not lint/edit
  "scripts",           # dev-only seed/validation tooling (long data literals)
]

[tool.ruff.lint]
select = ["E", "F", "I", "N", "W", "UP", "B", "SIM", "ARG"]
ignore = [
  "B008",   # FastAPI uses Depends()/Header() in argument defaults (intentional)
  "F401",   # __init__ re-exports are common in this codebase
  "F821",
  "ARG001", # FastAPI/slowapi require dependency-injected args (e.g. `request`) that the framework uses but the body does not
  "ARG002", # same as ARG001 for methods
  "E402",   # deliberate lazy module-level imports to avoid circular imports (auth, database, main, conftest)
]

[tool.mypy]
python_version = "3.13"
strict = false
ignore_missing_imports = true
disallow_untyped_defs = false

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"
